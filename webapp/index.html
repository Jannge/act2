<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pg-mcp · 自然语言转 SQL</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --panel: #ffffff;
      --border: #e2e8f0;
      --text: #1f2933;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --ok: #16a34a;
      --warn: #d97706;
      --err: #dc2626;
      --code-bg: #0f172a;
      --code-fg: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 18px; margin: 0; }
    .mode-badge {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      background: #eff6ff;
      color: var(--primary-dark);
      border: 1px solid #bfdbfe;
    }
    main {
      max-width: 960px;
      margin: 24px auto;
      padding: 0 16px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 16px;
    }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    textarea {
      width: 100%;
      min-height: 88px;
      resize: vertical;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
    }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin-top: 12px; }
    select, .radios { padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px; }
    .radios { display: inline-flex; gap: 16px; align-items: center; }
    .radios label { margin: 0; color: var(--text); }
    button {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 10px 22px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { background: var(--primary-dark); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .section-title { font-size: 13px; color: var(--muted); margin: 0 0 8px; text-transform: uppercase; letter-spacing: 0.04em; }
    pre {
      background: var(--code-bg);
      color: var(--code-fg);
      padding: 14px;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 13px;
      margin: 0;
    }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th, td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; }
    th { background: #f1f5f9; }
    .meta { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 10px; }
    .meta b { color: var(--text); }
    .hidden { display: none; }
    .err { color: var(--err); }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 12px; }
    .pill.ok { background: #dcfce7; color: var(--ok); }
    .pill.bad { background: #fee2e2; color: var(--err); }
  </style>
</head>
<body>
  <header>
    <h1>pg-mcp · 自然语言转 SQL</h1>
    <span class="mode-badge" id="modeBadge">检测中…</span>
  </header>

  <main>
    <div class="card">
      <label for="question">输入你的自然语言问题</label>
      <textarea id="question" placeholder="例如：最近 30 天注册的用户有多少？"></textarea>
      <div class="row">
        <div>
          <label for="database">目标数据库</label>
          <select id="database"><option value="">（默认）</option></select>
        </div>
        <div class="radios">
          <label><input type="radio" name="return_type" value="result" checked /> 执行并返回结果</label>
          <label><input type="radio" name="return_type" value="sql" /> 仅生成 SQL</label>
        </div>
        <button id="runBtn">运行查询</button>
      </div>
    </div>

    <div class="card hidden" id="sqlCard">
      <p class="section-title">生成的 SQL</p>
      <pre id="sqlOut"></pre>
    </div>

    <div class="card hidden" id="resultCard">
      <p class="section-title">查询结果</p>
      <div id="resultBody"></div>
      <div class="meta" id="metaOut"></div>
    </div>

    <div class="card hidden" id="errorCard">
      <p class="section-title err">错误信息</p>
      <pre id="errorOut" class="err"></pre>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    async function init() {
      try {
        const health = await fetch("/api/health").then((r) => r.json());
        $("modeBadge").textContent = health.mode === "demo" ? "Demo 模式" : "Live 模式";
        const dbs = await fetch("/api/databases").then((r) => r.json());
        const sel = $("database");
        (dbs.databases || []).forEach((name) => {
          const opt = document.createElement("option");
          opt.value = name;
          opt.textContent = name;
          sel.appendChild(opt);
        });
      } catch (e) {
        $("modeBadge").textContent = "离线";
      }
    }

    function hideAll() {
      ["sqlCard", "resultCard", "errorCard"].forEach((id) => $(id).classList.add("hidden"));
    }

    function renderResults(data) {
      const body = $("resultBody");
      body.innerHTML = "";
      if (data.data && data.data.columns && data.data.rows.length) {
        const table = document.createElement("table");
        const thead = document.createElement("thead");
        const htr = document.createElement("tr");
        data.data.columns.forEach((c) => {
          const th = document.createElement("th");
          th.textContent = c;
          htr.appendChild(th);
        });
        thead.appendChild(htr);
        table.appendChild(thead);
        const tbody = document.createElement("tbody");
        data.data.rows.forEach((row) => {
          const tr = document.createElement("tr");
          data.data.columns.forEach((c) => {
            const td = document.createElement("td");
            const v = row[c];
            td.textContent = v === null ? "NULL" : (typeof v === "object" ? JSON.stringify(v) : String(v));
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        body.appendChild(table);
      } else {
        body.textContent = "（无结果行 / 仅 SQL 模式）";
      }

      $("metaOut").innerHTML =
        `<span>置信度：<b>${data.confidence ?? "-"}</b></span>` +
        `<span>Token 用量：<b>${data.tokens_used ?? "-"}</b></span>` +
        (data.data ? `<span>行数：<b>${data.data.row_count ?? "-"}</b></span>` : "") +
        (data.data ? `<span>耗时：<b>${data.data.execution_time_ms ?? "-"} ms</b></span>` : "");
    }

    $("runBtn").addEventListener("click", async () => {
      hideAll();
      const btn = $("runBtn");
      btn.disabled = true;
      try {
        const payload = {
          question: $("question").value,
          database: $("database").value || null,
          return_type: document.querySelector('input[name="return_type"]:checked').value,
        };
        const resp = await fetch("/api/query", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await resp.json();
        if (!resp.ok || data.success === false) {
          $("errorCard").classList.remove("hidden");
          $("errorOut").textContent = JSON.stringify(data, null, 2);
          return;
        }
        $("sqlCard").classList.remove("hidden");
        $("sqlOut").textContent = data.generated_sql || "(无)";
        $("resultCard").classList.remove("hidden");
        renderResults(data);
      } catch (e) {
        $("errorCard").classList.remove("hidden");
        $("errorOut").textContent = String(e);
      } finally {
        btn.disabled = false;
      }
    });

    init();
  </script>
</body>
</html>
